name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One-time setup: the project was uploaded as tally.zip because GitHub's web uploader
      # flattens folders. Unpack it, commit the real files, and remove the zip.
      # The workflow file itself is kept as-is (.github is skipped).
      - name: Unpack uploaded project (first run only)
        if: hashFiles('tally.zip') != ''
        run: |
          unzip -q tally.zip -d /tmp/unpack
          rsync -a --exclude '.github' /tmp/unpack/tally/ ./
          git rm -q tally.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed yet, so `npm ci` would fail. Versions in package.json are pinned exactly.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # Reported but non-blocking until it has passed once on real type definitions.
      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
